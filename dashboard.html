<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body class="p-4">

    <div class="container-fluid">

        <header class="d-flex justify-content-between align-items-center mb-4 p-3 header-bg">
            <h1 class="text-light m-0">Post App</h1>

            <div class="profile-info text-light d-flex align-items-center">
                <div id="displayData" class="me-3"></div>
                <button onclick="logout()" class="btn btn-warning">Log Out</button>
            </div>
        </header>

        <div class="container mt-4">

            <div class="row">

                <div class="col-sm-12 col-md-6 col-lg-4">

                    <div id="formDiv" class="card p-3 m-2 form-card">

                        <h2 class="text-center mb-4">Create New Post</h2>

                        <div class="mb-3">
                            <label class="form-label">Title</label>

                            <input type="text" class="form-control" id="title" placeholder="Enter Title">
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea class="form-control" id="description" rows="4"
                                placeholder="Enter Description"></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Choose Theme Image
                            </label>

                            <div class="d-flex justify-content-between">

                                <img onclick="selectImg('assets/img-1.avif')" class="bgImg selectedImg"
                                    src="assets/img-1.avif">

                                <img onclick="selectImg('assets/img-2.avif')" class="bgImg" src="assets/img-2.avif">

                                <img onclick="selectImg('assets/img-3.avif')" class="bgImg" src="assets/img-3.avif">

                            </div>
                        </div>

                        <div class="d-grid gap-2">

                            <button onclick="post()" id="postButton" class="btn btn-primary">
                                Post
                            </button>

                            <button onclick="changeTheme()" class="btn btn-dark">
                                Change Theme
                            </button>

                        </div>
                    </div>
                </div>

                <div class="col-sm-12 col-md-6 col-lg-8">

                    <div id="postsSection">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h3 class="text-light">Your Posts</h3>

                            <button onclick="showForm()" class="btn btn-success">
                                + Add New Post
                            </button>

                        </div>

                        <div id="posts" class="d-flex flex-wrap gap-3">
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>

</body>

</html>
