<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Blog Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid p-4">
        <header class="header-bg d-flex justify-content-between align-items-center rounded-4 p-3 mb-4">
        <h2 class="text-white m-0">Post App</h2>
            <div class="d-flex align-items-center gap-3">
                <div id="displayData" class="text-white fw-bold"></div>
                <button onclick="logout()" class="btn btn-warning">
                    Log Out
                </button>
            </div>
        </header>

        <div class="container">
            <div class="row g-4">
                <div class="col-12 col-lg-4">
                    <div id="formDiv" class="card shadow-lg border-0 rounded-4 p-4 form-card">
                        <h3 class="text-center mb-4">
                            Create New Post
                        </h3>

                        <div class="mb-3">
                            <label class="form-label">
                                Title
                            </label>
                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Enter Title">
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>
                            <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter Description"></textarea>
                        </div>

                        <h6 class="text-center mb-3">
                            Choose Theme Image
                        </h6>

                        <div class="d-flex justify-content-between mb-4">
                            <img src="assets/img-1.avif"
                                class="bgImg selectedImg"
                                onclick="selectImg('assets/img-1.avif')">
                            <img src="assets/img-2.avif"
                                class="bgImg"
                                onclick="selectImg('assets/img-2.avif')">
                            <img src="assets/img-3.avif"
                                class="bgImg"
                                onclick="selectImg('assets/img-3.avif')">
                        </div>

                        <div class="d-grid gap-2">
                            <button
                                onclick="post()"
                                id="postButton"
                                class="btn btn-primary">
                                Post
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-8">
                    <div id="postsSection">
                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <h3 class="text-white m-0">
                                Your Posts
                            </h3>

                            <button
                                onclick="showForm()"
                                class="btn btn-success">
                                + Add New Post
                            </button>
                        </div>
                        <div id="posts" class="row g-3">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>

</body>

</html>
