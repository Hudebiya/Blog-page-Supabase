<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Blog Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">

</head>
<body>

<div class="auth-container">

    <div class="auth-info">
        <h1>Welcome 👋</h1>
        <p>
            Create your account and manage your blog posts easily.
            Login or Signup to continue.
        </p>
    </div>

    <div class="auth-card">
        <!-- LOGIN FORM -->

        <div id="loginForm">
            <h2 class="text-center mb-4">
                Admin Login
            </h2>

            <input
            id="loginEmail"
            type="email"
            class="form-control mb-3"
            placeholder="Email Address">

            <input
            id="loginPass"
            type="password"
            class="form-control mb-3"
            placeholder="Password">

            <button
            onclick="loginUser()"
            class="btn btn-dark w-100">
                Login
            </button>
            <p class="switch-text">
                Don't have an account?
                <span onclick="showSignup()">
                    Create Account
                </span>
            </p>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" class="d-none">
            <h2 class="text-center mb-4">
                Sign Up
            </h2>

            <input
            id="userName"
            type="text"
            class="form-control mb-3"
            placeholder="Full Name">

            <input
            id="userEmail"
            type="email"
            class="form-control mb-3"
            placeholder="Email Address">

            <input
            id="userPass"
            type="password"
            class="form-control mb-3"
            placeholder="Password">

            <button
            onclick="signupUser(event)"
            class="btn btn-success w-100">
                Create Account
            </button>
            <p class="switch-text">
                Already have an account?
                <span onclick="showLogin()">
                    Login
                </span>
            </p>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="adminpannel.js"></script>

</body>
</html>
