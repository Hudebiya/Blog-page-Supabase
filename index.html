<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Blog Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-info">
            <h1>Welcome 👋</h1>
            <p>
                Create your account and manage your blog posts easily.
                Login or Signup to continue.
            </p>
        </div>

        <!-- Right Side -->
        <div class="auth-card">

            <!-- Login Form -->
            <div id="loginForm">

                <h2 class="text-center mb-4">Login</h2>

                <input type="email" class="form-control mb-3" placeholder="Email Address">

                <input type="password" class="form-control mb-3" placeholder="Password">

                <button onclick="goToDashboard()" class="btn btn-dark w-100">
                    Login
                </button>

                <p class="switch-text">
                    Don't have an account?
                    <span onclick="showSignup()">Create Account</span>
                </p>

            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="d-none">

                <h2 class="text-center mb-4">Create Account</h2>

                <input type="text" class="form-control mb-3" placeholder="Full Name">

                <input type="email" class="form-control mb-3" placeholder="Email Address">

                <input type="text" class="form-control mb-3" placeholder="Phone Number">

                <input type="password" class="form-control mb-3" placeholder="Password">

                <input type="password" class="form-control mb-3" placeholder="Confirm Password">

                <button onclick="goToDashboard()" class="btn btn-success w-100">
                    Create Account
                </button>

                <p class="switch-text">
                    Already have an account?
                    <span onclick="showLogin()">Login</span>
                </p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="auth.js"></script>
</body>
</html>
